name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build & unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BusNap.xcodeproj \
            -scheme BusNap \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:BusNapTests \
            CODE_SIGNING_ALLOWED=NO
